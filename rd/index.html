<html>


<style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;900&display=swap');

    :root {
        --void: #060907;
        --panel: #0b1310;
        --panel-2: #0e1815;
        --line: #1c2b24;
        --line-soft: #152019;
        --green: #3ddc84;
        --green-dim: #1f6b47;
        --amber: #f2a93b;
        --amber-dim: #7a5a1e;
        --red: #ff6157;
        --text: #d3ded6;
        --text-dim: #7c8f83;
        --text-faint: #4d5d54;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    #study-terminal-root {
        direction: rtl;
        background: var(--void);
        color: var(--text);
        font-family: 'Vazirmatn', sans-serif;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        line-height: 1.7;
    }

    #study-terminal-root .mono {
        font-family: 'JetBrains Mono', monospace;
        direction: ltr;
        unicode-bidi: isolate;
    }

    /* scanline / crt texture */
    #study-terminal-root::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(to bottom,
                rgba(255, 255, 255, 0.018) 0px,
                rgba(255, 255, 255, 0.018) 1px,
                transparent 1px,
                transparent 3px);
        z-index: 50;
        mix-blend-mode: overlay;
    }

    #study-terminal-root::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 0%, rgba(61, 220, 132, 0.05), transparent 60%);
        z-index: 49;
    }

    .st-wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 0 20px;
    }

    /* ---------- window chrome ---------- */
    .st-window {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 30px 60px -20px rgba(0, 0, 0, 0.6);
        overflow: hidden;
    }

    .st-titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: var(--panel-2);
        border-bottom: 1px solid var(--line);
    }

    .st-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
    }

    .st-titlebar .st-path {
        margin-inline-start: 10px;
        color: var(--text-faint);
        font-size: 12.5px;
    }

    /* ---------- hero ---------- */
    .st-hero {
        padding: 56px 34px 44px;
        text-align: center;
    }

    .st-hero-label {
        font-size: 13px;
        color: var(--text-dim);
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .st-hero-label .st-pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 10px var(--green);
        animation: st-blink 1.6s ease-in-out infinite;
    }

    @keyframes st-blink {

        0%,
        100% {
            opacity: 1;
        }

        50% {
            opacity: .25;
        }
    }

    .st-clock {
        font-family: 'JetBrains Mono', monospace;
        direction: ltr;
        font-size: clamp(48px, 11vw, 96px);
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--green);
        text-shadow: 0 0 18px rgba(61, 220, 132, 0.45), 0 0 50px rgba(61, 220, 132, 0.12);
        line-height: 1;
    }

    .st-clock.live {
        animation: st-glow 2.4s ease-in-out infinite;
    }

    @keyframes st-glow {

        0%,
        100% {
            text-shadow: 0 0 18px rgba(61, 220, 132, 0.45), 0 0 50px rgba(61, 220, 132, 0.12);
        }

        50% {
            text-shadow: 0 0 26px rgba(61, 220, 132, 0.7), 0 0 70px rgba(61, 220, 132, 0.22);
        }
    }

    .st-clock-sub {
        margin-top: 10px;
        font-size: 13px;
        color: var(--text-faint);
    }

    .st-status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 26px;
        padding: 10px 18px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        font-size: 14.5px;
    }

    .st-status.hi {
        border-color: var(--amber-dim);
        color: var(--amber);
    }

    .st-status.ok {
        border-color: var(--green-dim);
        color: var(--green);
    }

    .st-status .tag {
        font-family: 'JetBrains Mono', monospace;
        direction: ltr;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.05);
    }

    .st-banner {
        margin: 30px auto 0;
        max-width: 520px;
        border: 1px dashed var(--line);
        border-radius: 6px;
        padding: 16px 20px;
        font-size: 15px;
        color: var(--text);
        background: linear-gradient(180deg, rgba(61, 220, 132, 0.045), transparent);
    }

    .st-banner b {
        color: var(--green);
        font-weight: 700;
    }

    .st-scrollhint {
        margin-top: 40px;
        color: var(--text-faint);
        font-size: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
    }

    .st-scrollhint .chev {
        font-family: 'JetBrains Mono', monospace;
        animation: st-bounce 1.8s ease-in-out infinite;
    }

    @keyframes st-bounce {

        0%,
        100% {
            transform: translateY(0);
            opacity: .4;
        }

        50% {
            transform: translateY(6px);
            opacity: 1;
        }
    }

    /* ---------- section shell ---------- */
    .st-section {
        padding: 64px 0 0;
    }

    .st-section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line-soft);
    }

    .st-section-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
    }

    .st-section-cmd {
        font-family: 'JetBrains Mono', monospace;
        direction: ltr;
        font-size: 12px;
        color: var(--text-faint);
    }

    /* ---------- total summary ---------- */
    .st-total-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 30px 20px;
        text-align: center;
    }

    .st-total-figure {
        font-family: 'JetBrains Mono', monospace;
        direction: ltr;
        font-size: clamp(30px, 6vw, 46px);
        font-weight: 700;
        color: var(--green);
        text-shadow: 0 0 16px rgba(61, 220, 132, 0.25);
    }

    .st-total-sub {
        margin-top: 8px;
        font-size: 13px;
        color: var(--text-dim);
    }

    .st-total-stats {
        display: flex;
        justify-content: center;
        gap: 34px;
        margin-top: 22px;
        flex-wrap: wrap;
    }

    .st-total-stat {
        text-align: center;
    }

    .st-total-stat .num {
        font-family: 'JetBrains Mono', monospace;
        direction: ltr;
        font-size: 19px;
        color: var(--amber);
    }

    .st-total-stat .label {
        font-size: 11.5px;
        color: var(--text-faint);
        margin-top: 5px;
    }

    /* ---------- staircase chart ---------- */
    .st-stairs-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 26px 20px 16px;
    }

    .st-stairs {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 180px;
        direction: ltr;
    }

    .st-stair {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        height: 100%;
        position: relative;
    }

    .st-stair-bar {
        width: 100%;
        max-width: 34px;
        background: linear-gradient(180deg, var(--green), var(--green-dim));
        border-radius: 3px 3px 0 0;
        min-height: 3px;
        box-shadow: 0 0 14px rgba(61, 220, 132, 0.25);
        transition: height .5s ease;
    }

    .st-stair.is-today .st-stair-bar {
        background: linear-gradient(180deg, var(--amber), var(--amber-dim));
        box-shadow: 0 0 16px rgba(242, 169, 59, 0.35);
    }

    .st-stair-you {
        position: absolute;
        top: -22px;
        font-size: 10px;
        color: var(--amber);
        font-family: 'JetBrains Mono', monospace;
        white-space: nowrap;
    }

    .st-stair-val {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: var(--text-faint);
        margin-top: 6px;
    }

    .st-stair-day {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: var(--text-faint);
        margin-top: 2px;
    }

    /* ---------- day log ---------- */
    .st-log {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .st-log-entry {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        overflow: hidden;
    }

    .st-log-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 16px;
        cursor: pointer;
        user-select: none;
    }

    .st-log-head:hover {
        background: var(--panel-2);
    }

    .st-log-date {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .st-log-date .mono {
        color: var(--text-dim);
        font-size: 13px;
    }

    .st-log-total {
        font-family: 'JetBrains Mono', monospace;
        color: var(--green);
        font-size: 14px;
    }

    .st-log-caret {
        color: var(--text-faint);
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        transition: transform .2s;
    }

    .st-log-entry.open .st-log-caret {
        transform: rotate(90deg);
    }

    .st-log-body {
        display: none;
        padding: 0 16px 14px;
    }

    .st-log-entry.open .st-log-body {
        display: block;
    }

    .st-log-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 0;
        border-top: 1px solid var(--line-soft);
        font-size: 13.5px;
    }

    .st-log-row .name {
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .st-log-row .chip {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex: none;
    }

    .st-log-row .hrs {
        font-family: 'JetBrains Mono', monospace;
        color: var(--text-dim);
        font-size: 12.5px;
    }

    /* ---------- process table (courses) ---------- */
    .st-proc {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
    }

    .st-proc-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line-soft);
    }

    .st-proc-row:last-child {
        border-bottom: none;
    }

    .st-proc-chip {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
    }

    .st-proc-name {
        flex: 1;
        min-width: 0;
    }

    .st-proc-name .title {
        font-size: 14.5px;
        color: var(--text);
    }

    .st-proc-name .pos {
        font-size: 12px;
        color: var(--text-faint);
        margin-top: 3px;
    }

    .st-proc-name .pos b {
        color: var(--amber);
        font-weight: 600;
    }

    .st-proc-hours {
        font-family: 'JetBrains Mono', monospace;
        color: var(--green);
        font-size: 14px;
        direction: ltr;
    }

    .st-proc-bar-track {
        width: 64px;
        height: 5px;
        background: var(--line-soft);
        border-radius: 3px;
        overflow: hidden;
        flex: none;
    }

    .st-proc-bar-fill {
        height: 100%;
        background: var(--green);
    }

    /* ---------- checkin ---------- */
    .st-checkin {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 18px;
    }

    .st-checkin-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .st-select,
    .st-input {
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 5px;
        padding: 11px 12px;
        font-family: 'Vazirmatn', sans-serif;
        font-size: 14px;
        outline: none;
    }

    .st-select {
        min-width: 160px;
    }

    .st-input {
        flex: 1;
        min-width: 200px;
    }

    .st-select:focus,
    .st-input:focus {
        border-color: var(--green-dim);
    }

    .st-btn {
        font-family: 'Vazirmatn', sans-serif;
        font-weight: 600;
        font-size: 14px;
        background: var(--green);
        color: #04140c;
        border: none;
        border-radius: 5px;
        padding: 11px 22px;
        cursor: pointer;
    }

    .st-btn:hover {
        filter: brightness(1.08);
    }

    .st-btn:disabled {
        opacity: .5;
        cursor: default;
    }

    .st-checkin-hint {
        margin-top: 10px;
        font-size: 12px;
        color: var(--text-faint);
    }

    .st-checkin-log {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .st-checkin-item {
        display: flex;
        gap: 10px;
        align-items: baseline;
        font-size: 13px;
        padding: 9px 0;
        border-top: 1px solid var(--line-soft);
    }

    .st-checkin-item .mono {
        color: var(--text-faint);
        font-size: 11.5px;
    }

    .st-checkin-item .course {
        color: var(--green);
        font-weight: 600;
        flex: none;
    }

    .st-checkin-item .note {
        color: var(--text-dim);
    }

    /* ---------- setup / states ---------- */
    .st-setup {
        max-width: 560px;
        margin: 80px auto;
        padding: 0 20px;
    }

    .st-field {
        margin-bottom: 14px;
    }

    .st-field label {
        display: block;
        font-size: 13px;
        color: var(--text-dim);
        margin-bottom: 7px;
    }

    .st-help {
        font-size: 12px;
        color: var(--text-faint);
        margin-top: 16px;
        line-height: 1.9;
    }

    .st-help a {
        color: var(--green);
    }

    .st-error {
        margin-top: 14px;
        padding: 11px 14px;
        border: 1px solid var(--red);
        border-radius: 5px;
        color: var(--red);
        font-size: 13px;
        background: rgba(255, 97, 87, 0.06);
    }

    .st-loading {
        text-align: center;
        padding: 120px 20px;
        color: var(--text-dim);
        font-size: 14px;
    }

    .st-loading .mono {
        color: var(--green);
    }

    .st-footer {
        text-align: center;
        padding: 50px 20px 70px;
        color: var(--text-faint);
        font-size: 12px;
    }

    .st-settings-link {
        background: none;
        border: none;
        color: var(--text-faint);
        cursor: pointer;
        font-size: 12px;
        text-decoration: underline;
        font-family: 'Vazirmatn', sans-serif;
    }

    .st-settings-link:hover {
        color: var(--text-dim);
    }

    @media (max-width:600px) {
        .st-hero {
            padding: 44px 18px 34px;
        }

        .st-clock {
            font-size: clamp(38px, 15vw, 64px);
        }

        .st-stairs {
            height: 140px;
        }
    }
</style>

<div id="study-terminal-root" dir="rtl" lang="fa">
    <div id="st-app"></div>
</div>

<script>
    (function () {
        const CONFIG_KEY = 'clockify-config';
        const NOTES_KEY = 'progress-notes';
        const API = 'https://api.clockify.me/api/v1';

        const state = {
            phase: 'boot', // boot | setup | loading | error | ready
            config: null,
            errorMsg: '',
            projects: [],
            tasksByProject: {},
            entries: [],
            notes: [],
            openLog: {},
            tick: 0
        };

        const root = document.getElementById('st-app');
        const palette = ['#3ddc84', '#f2a93b', '#5aa9e6', '#e06c9f', '#8b7ff0', '#4dd0c4', '#e0a45a', '#7fd1e0'];
        function colorFor(id) {
            let h = 0;
            for (let i = 0; i < id.length; i++) { h = (h * 31 + id.charCodeAt(i)) >>> 0; }
            return palette[h % palette.length];
        }

        function pad(n) { return String(n).padStart(2, '0'); }
        function fmtHMS(totalSeconds) {
            totalSeconds = Math.max(0, Math.round(totalSeconds));
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            return `${pad(h)}:${pad(m)}:${pad(s)}`;
        }
        function fmtHM(totalSeconds) {
            totalSeconds = Math.max(0, Math.round(totalSeconds));
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            if (h <= 0) return `${m} دقیقه`;
            if (m === 0) return `${h} ساعت`;
            return `${h} ساعت و ${m} دقیقه`;
        }
        function parseISODuration(iso) {
            if (!iso) return 0;
            const match = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?$/.exec(iso);
            if (!match) return 0;
            const h = parseFloat(match[1] || 0), m = parseFloat(match[2] || 0), s = parseFloat(match[3] || 0);
            return h * 3600 + m * 60 + s;
        }
        function localDateKey(d) {
            const y = d.getFullYear(), m = pad(d.getMonth() + 1), day = pad(d.getDate());
            return `${y}-${m}-${day}`;
        }
        function weekdayFa(d) {
            return new Intl.DateTimeFormat('fa-IR', { weekday: 'short' }).format(d);
        }
        function jalaliCompact(d) {
            return new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
        }
        function jalaliLong(d) {
            return new Intl.DateTimeFormat('fa-IR-u-ca-persian', { day: 'numeric', month: 'long' }).format(d);
        }
        function parseDateKey(key) {
            const [y, m, d] = key.split('-').map(Number);
            return new Date(y, m - 1, d);
        }
        function todayKey() { return localDateKey(new Date()); }

        async function api(path, apiKey) {
            const res = await fetch(API + path, { headers: { 'X-Api-Key': apiKey } });
            if (!res.ok) {
                const txt = await res.text().catch(() => '');
                throw new Error(`${res.status} ${res.statusText} ${txt}`.trim());
            }
            return res.json();
        }

        function hasStorage() {
            return typeof window !== 'undefined' && !!window.storage && typeof window.storage.set === 'function';
        }
        function waitForStorage(maxWaitMs, intervalMs) {
            maxWaitMs = maxWaitMs || 3000; intervalMs = intervalMs || 100;
            return new Promise(resolve => {
                const start = Date.now();
                (function check() {
                    if (hasStorage() || (Date.now() - start) >= maxWaitMs) { resolve(hasStorage()); return; }
                    setTimeout(check, intervalMs);
                })();
            });
        }
        async function loadNotes() {
            if (!hasStorage()) { return; }
            try {
                const r = await window.storage.get(NOTES_KEY, false);
                state.notes = r ? JSON.parse(r.value) : [];
            } catch (e) { state.notes = state.notes || []; }
        }
        async function saveNotes() {
            if (!hasStorage()) return;
            try { await window.storage.set(NOTES_KEY, JSON.stringify(state.notes), false); }
            catch (e) { /* keep working in-memory even if persistence fails */ }
        }
        async function loadConfig() {
            if (!hasStorage()) return null;
            try {
                const r = await window.storage.get(CONFIG_KEY, false);
                return r ? JSON.parse(r.value) : null;
            } catch (e) { return null; }
        }
        async function saveConfig(cfg) {
            if (!hasStorage()) return;
            try { await window.storage.set(CONFIG_KEY, JSON.stringify(cfg), false); }
            catch (e) { /* keep working in-memory even if persistence fails */ }
        }

        async function fetchAllEntries(cfg) {
            let all = [];
            for (let page = 1; page <= 12; page++) {
                const chunk = await api(`/workspaces/${cfg.workspaceId}/user/${cfg.userId}/time-entries?hydrated=true&page-size=200&page=${page}`, cfg.apiKey);
                all = all.concat(chunk);
                if (chunk.length < 200) break;
            }
            return all;
        }

        async function loadAll() {
            state.phase = 'loading';
            render();
            try {
                const cfg = state.config;
                const [projects, entries] = await Promise.all([
                    api(`/workspaces/${cfg.workspaceId}/projects?page-size=200&archived=false`, cfg.apiKey),
                    fetchAllEntries(cfg)
                ]);
                state.projects = projects;
                state.entries = entries;

                const tasksByProject = {};
                await Promise.all(projects.map(async p => {
                    try {
                        const tasks = await api(`/workspaces/${cfg.workspaceId}/projects/${p.id}/tasks?page-size=200`, cfg.apiKey);
                        tasksByProject[p.id] = tasks;
                    } catch (e) { tasksByProject[p.id] = []; }
                }));
                state.tasksByProject = tasksByProject;

                await loadNotes();
                state.phase = 'ready';
            } catch (e) {
                state.phase = 'error';
                state.errorMsg = e.message || 'خطای نامشخص';
            }
            render();
        }

        // ---------- derived data ----------
        function computeDaily() {
            const map = {}; // dateKey -> { total, byProject: {id: seconds} }
            let runningExtra = 0;
            for (const e of state.entries) {
                const start = e.timeInterval && e.timeInterval.start ? new Date(e.timeInterval.start) : null;
                if (!start) continue;
                const isRunning = !e.timeInterval.end;
                const seconds = isRunning
                    ? (Date.now() - start.getTime()) / 1000
                    : parseISODuration(e.timeInterval.duration);
                const key = localDateKey(start);
                if (!map[key]) map[key] = { total: 0, byProject: {} };
                map[key].total += seconds;
                const pid = e.projectId || 'none';
                map[key].byProject[pid] = (map[key].byProject[pid] || 0) + seconds;
            }
            return map;
        }

        function computeProjectTotals() {
            const totals = {}; // pid -> { seconds, byTask:{tid:seconds} }
            for (const e of state.entries) {
                const pid = e.projectId; if (!pid) continue;
                const start = e.timeInterval && e.timeInterval.start ? new Date(e.timeInterval.start) : null;
                if (!start) continue;
                const isRunning = !e.timeInterval.end;
                const seconds = isRunning ? (Date.now() - start.getTime()) / 1000 : parseISODuration(e.timeInterval.duration);
                if (!totals[pid]) totals[pid] = { seconds: 0, byTask: {} };
                totals[pid].seconds += seconds;
                const tid = e.taskId || 'none';
                totals[pid].byTask[tid] = (totals[pid].byTask[tid] || 0) + seconds;
            }
            return totals;
        }

        function last14Days() {
            const days = [];
            const now = new Date();
            for (let i = 13; i >= 0; i--) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                days.push(d);
            }
            return days;
        }

        function encouragement(todaySeconds) {
            const h = todaySeconds / 3600;
            if (h <= 0) return { cls: '', tag: 'IDLE', text: 'هنوز شروع نکردی — کرونومتر رو روشن کن' };
            if (h < 6) return { cls: 'ok', tag: 'RUN', text: 'آفرین! بیشتر بخون' };
            return { cls: 'hi', tag: 'DONE', text: 'برای امروز عالی بودی، استراحتی کن' };
        }

        function latestNoteFor(pid) {
            const notes = state.notes.filter(n => n.projectId === pid);
            if (!notes.length) return null;
            return notes.slice().sort((a, b) => b.timestamp - a.timestamp)[0];
        }

        // ---------- render ----------
        function render() {
            if (state.phase === 'boot' || state.phase === 'loading') {
                root.innerHTML = `
        <div class="st-loading">
          <div dir="ltr" class="mono" style="font-size:20px;">$ connecting to clockify...</div>
          <div style="margin-top:10px;">در حال دریافت داده‌های درس‌خوانی</div>
        </div>`;
                return;
            }
            if (state.phase === 'setup') {
                renderSetup();
                return;
            }
            if (state.phase === 'error') {
                root.innerHTML = `
        <div class="st-setup">
          <div class="st-window">
            <div class="st-titlebar">
              <span class="st-dot" style="background:#ff5f56"></span>
              <span class="st-dot" style="background:#ffbd2e"></span>
              <span class="st-dot" style="background:#27c93f"></span>
              <span dir="ltr" class="st-path mono">error</span>
            </div>
            <div style="padding:30px;">
              <div dir="ltr" class="mono" style="color:var(--red);font-size:14px;">$ connection failed</div>
              <div class="st-error">${escapeHtml(state.errorMsg)}</div>
              <button class="st-btn" style="margin-top:16px;" onclick="StudyTerminal.retry()">تلاش دوباره</button>
              <button class="st-settings-link" style="margin-inline-start:14px;" onclick="StudyTerminal.reset()">تغییر تنظیمات اتصال</button>
            </div>
          </div>
        </div>`;
                return;
            }
            renderReady();
        }

        function renderSetup() {
            root.innerHTML = `
      <div class="st-setup">
        <div class="st-window">
          <div class="st-titlebar">
            <span class="st-dot" style="background:#ff5f56"></span>
            <span class="st-dot" style="background:#ffbd2e"></span>
            <span class="st-dot" style="background:#27c93f"></span>
            <span dir="ltr" class="st-path mono">~/setup</span>
          </div>
          <div style="padding:30px;">
            <div dir="ltr" class="mono" style="color:var(--green);font-size:14px;margin-bottom:20px;">$ اتصال به Clockify</div>
            <div class="st-field">
              <label>API Key</label>
              <input class="st-input" style="width:100%;" id="st-in-key" type="password" placeholder="از پروفایل Clockify کپی کن" />
            </div>
            <div class="st-field">
              <label>Workspace (اختیاری — اگر خالی بگذاری، اولین ورک‌اسپیس انتخاب می‌شود)</label>
              <input class="st-input" style="width:100%;" id="st-in-ws" type="text" placeholder="Workspace ID یا نام" />
            </div>
            <button class="st-btn" id="st-connect-btn" onclick="StudyTerminal.connect()">اتصال</button>
            <div id="st-setup-error"></div>
            <div class="st-help">
              کلید API را از
              <a href="https://app.clockify.me/user/settings" target="_blank" rel="noopener">تنظیمات پروفایل Clockify</a>
              کپی کن. این کلید فقط در همین مرورگر ذخیره می‌شود.
            </div>
          </div>
        </div>
      </div>`;
        }

        function renderReady() {
            const dailyMap = computeDaily();
            const projTotals = computeProjectTotals();
            const days = last14Days();
            const tk = todayKey();
            const todayTotal = (dailyMap[tk] && dailyMap[tk].total) || 0;
            const hasRunning = state.entries.some(e => e.timeInterval && !e.timeInterval.end);
            const enc = encouragement(todayTotal);

            const maxDay = Math.max(1, ...days.map(d => (dailyMap[localDateKey(d)] || {}).total || 0));

            const grandTotalSeconds = Object.values(dailyMap).reduce((sum, d) => sum + d.total, 0);
            const studyDaysCount = Object.keys(dailyMap).length;
            const avgPerDaySeconds = studyDaysCount > 0 ? grandTotalSeconds / studyDaysCount : 0;

            const stairsHtml = days.map(d => {
                const key = localDateKey(d);
                const seconds = (dailyMap[key] || {}).total || 0;
                const heightPct = Math.max(seconds > 0 ? 6 : 2, Math.round((seconds / maxDay) * 100));
                const isToday = key === tk;
                return `
        <div class="st-stair ${isToday ? 'is-today' : ''}">
          ${isToday ? `<div class="st-stair-you">اینجایی</div>` : ''}
          <div class="st-stair-bar" style="height:${heightPct}%"></div>
          <div dir="ltr" class="st-stair-val mono">${seconds > 0 ? (seconds / 3600).toFixed(1) : '—'}</div>
          <div class="st-stair-day">${weekdayFa(d)}</div>
        </div>`;
            }).join('');

            const sortedDays = days.slice().reverse();
            const logHtml = sortedDays.map(d => {
                const key = localDateKey(d);
                const info = dailyMap[key];
                if (!info || info.total <= 0) return '';
                const open = !!state.openLog[key];
                const rows = Object.entries(info.byProject).map(([pid, secs]) => {
                    const proj = state.projects.find(p => p.id === pid);
                    const name = proj ? proj.name : 'بدون پروژه';
                    const color = proj ? (proj.color || colorFor(pid)) : 'var(--text-faint)';
                    return `
          <div class="st-log-row">
            <div class="name"><span class="chip" style="background:${color}"></span>${escapeHtml(name)}</div>
            <div class="hrs">${fmtHM(secs)}</div>
          </div>`;
                }).join('');
                return `
        <div class="st-log-entry ${open ? 'open' : ''}">
          <div class="st-log-head" onclick="StudyTerminal.toggleLog('${key}')">
            <div class="st-log-date">
              <span dir="ltr" class="mono">${jalaliCompact(d)}</span>
              <span>${weekdayFa(d)}، ${jalaliLong(d)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <span dir="ltr" class="st-log-total mono">${fmtHM(info.total)}</span>
              <span class="st-log-caret">›</span>
            </div>
          </div>
          <div class="st-log-body">${rows}</div>
        </div>`;
            }).filter(Boolean).join('') || `<div style="color:var(--text-faint);font-size:13px;padding:14px 0;">هنوز داده‌ای برای روزهای اخیر ثبت نشده.</div>`;

            const maxProj = Math.max(1, ...Object.values(projTotals).map(p => p.seconds));
            const procHtml = state.projects.length ? state.projects.map(p => {
                const t = projTotals[p.id] || { seconds: 0 };
                const pct = Math.round((t.seconds / maxProj) * 100);
                const note = latestNoteFor(p.id);
                return `
        <div class="st-proc-row">
          <span class="st-proc-chip" style="background:${p.color || colorFor(p.id)}"></span>
          <div class="st-proc-name">
            <div class="title">${escapeHtml(p.name)}</div>
            ${note ? `<div class="pos">آخرین پیشرفت: <b>${escapeHtml(note.note)}</b></div>` : `<div class="pos">هنوز پیشرفتی ثبت نشده</div>`}
          </div>
          <div class="st-proc-bar-track"><div class="st-proc-bar-fill" style="width:${pct}%"></div></div>
          <div dir="ltr" class="st-proc-hours mono">${fmtHM(t.seconds)}</div>
        </div>`;
            }).join('') : `<div style="padding:20px;color:var(--text-faint);font-size:13px;">هیچ پروژه‌ای (درسی) در Clockify پیدا نشد. اول یک پروژه بساز.</div>`;

            const courseOptions = state.projects.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');

            const recentNotes = state.notes.slice().sort((a, b) => b.timestamp - a.timestamp).slice(0, 8).map(n => `
      <div class="st-checkin-item">
        <span dir="ltr" class="mono">${jalaliCompact(parseDateKey(n.date))}</span>
        <span class="course">${escapeHtml(n.projectName)}</span>
        <span class="note">${escapeHtml(n.note)}</span>
      </div>`).join('') || `<div style="color:var(--text-faint);font-size:13px;">هنوز چک‌این ثبت نشده.</div>`;

            root.innerHTML = `
      <div class="st-hero">
        <div class="st-wrap">
          <div class="st-hero-label">
            <span class="st-pulse-dot" style="${hasRunning ? '' : 'display:none'}"></span>
            <span dir="ltr" class="mono">${hasRunning ? 'RECORDING' : 'TODAY'}</span>
          </div>
          <div class="st-clock ${hasRunning ? 'live' : ''}" id="st-clock" dir="ltr">${fmtHMS(todayTotal)}</div>
          <div class="st-clock-sub">زمان مطالعه امروز</div>

          <div class="st-status ${enc.cls}">
            <span class="tag">${enc.tag}</span>
            <span>${enc.text}</span>
          </div>

          <div class="st-banner">
            شریف در انتظار توست، تو باید وارد دانشگاه شریف بشی
          </div>

          <div class="st-scrollhint">
            <span>جزئیات را پایین‌تر ببین</span>
            <span dir="ltr" class="chev mono">⌄</span>
          </div>
        </div>
      </div>

      <div class="st-wrap">

        <div class="st-section">
          <div class="st-section-head">
            <div class="st-section-title">مجموع کل مطالعه</div>
            <div class="st-section-cmd">$ wc --all-time</div>
          </div>
          <div class="st-total-panel">
            <div dir="ltr" class="st-total-figure mono">${fmtHM(grandTotalSeconds)}</div>
            <div class="st-total-sub">از اولین باری که ثبت‌ساعت داشتی تا الان</div>
            <div class="st-total-stats">
              <div class="st-total-stat"><div dir="ltr" class="num mono">${studyDaysCount}</div><div class="label">روز مطالعه</div></div>
              <div class="st-total-stat"><div dir="ltr" class="num mono">${state.projects.length}</div><div class="label">درس</div></div>
              <div class="st-total-stat"><div dir="ltr" class="num mono">${fmtHM(avgPerDaySeconds)}</div><div class="label">میانگین روزانه</div></div>
            </div>
          </div>
        </div>

        <div class="st-section">
          <div class="st-section-head">
            <div class="st-section-title">۱۴ روز اخیر</div>
            <div class="st-section-cmd">$ history --days=14</div>
          </div>
          <div class="st-stairs-panel">
            <div class="st-stairs">${stairsHtml}</div>
          </div>
        </div>

        <div class="st-section">
          <div class="st-section-head">
            <div class="st-section-title">درس‌ها</div>
            <div class="st-section-cmd">$ ps --study</div>
          </div>
          <div class="st-proc">${procHtml}</div>
        </div>

        <div class="st-section">
          <div class="st-section-head">
            <div class="st-section-title">گزارش روزانه</div>
            <div class="st-section-cmd">$ tail -f study.log</div>
          </div>
          <div class="st-log">${logHtml}</div>
        </div>

        <div class="st-section">
          <div class="st-section-head">
            <div class="st-section-title">امروز تا کجا خوندی؟</div>
            <div class="st-section-cmd">$ checkin --today</div>
          </div>
          <div class="st-checkin">
            <div class="st-checkin-row">
              <select class="st-select" id="st-checkin-course">
                <option value="">انتخاب درس...</option>
                ${courseOptions}
              </select>
              <input class="st-input" id="st-checkin-note" type="text" placeholder="مثلاً: تا صفحه ۴۵ فصل ۳ رسیدم" />
              <button class="st-btn" onclick="StudyTerminal.submitCheckin()">ثبت</button>
            </div>
            <div class="st-checkin-hint">هر بار که ثبت کنی، به‌عنوان آخرین پیشرفت آن درس نمایش داده می‌شود.</div>
            <div class="st-checkin-log">${recentNotes}</div>
          </div>
        </div>

        <div class="st-footer">
          <span dir="ltr" class="mono">_</span>
          <div style="margin-top:14px;">
            <button class="st-settings-link" onclick="StudyTerminal.reset()">تغییر اتصال Clockify</button>
          </div>
        </div>
      </div>
    `;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // ---------- controller ----------
        const StudyTerminal = {
            async connect() {
                const apiKey = document.getElementById('st-in-key').value.trim();
                const wsInput = document.getElementById('st-in-ws').value.trim();
                const errBox = document.getElementById('st-setup-error');
                const btn = document.getElementById('st-connect-btn');
                if (!apiKey) {
                    errBox.innerHTML = `<div class="st-error">API Key را وارد کن.</div>`;
                    return;
                }
                btn.disabled = true; btn.textContent = 'در حال بررسی...';
                try {
                    const user = await api('/user', apiKey);
                    const workspaces = await api('/workspaces', apiKey);
                    if (!workspaces.length) throw new Error('هیچ ورک‌اسپیسی برای این حساب پیدا نشد.');
                    let ws = workspaces[0];
                    if (wsInput) {
                        ws = workspaces.find(w => w.id === wsInput || w.name === wsInput) || ws;
                    }
                    state.config = { apiKey, workspaceId: ws.id, userId: user.id };
                    await saveConfig(state.config);
                    await loadAll();
                } catch (e) {
                    errBox.innerHTML = `<div class="st-error">اتصال ناموفق بود: ${escapeHtml(e.message || '')}</div>`;
                    btn.disabled = false; btn.textContent = 'اتصال';
                }
            },
            async retry() { await loadAll(); },
            async reset() {
                state.phase = 'setup';
                render();
            },
            toggleLog(key) {
                state.openLog[key] = !state.openLog[key];
                render();
            },
            async submitCheckin() {
                const sel = document.getElementById('st-checkin-course');
                const input = document.getElementById('st-checkin-note');
                const pid = sel.value;
                const note = input.value.trim();
                if (!pid || !note) return;
                const proj = state.projects.find(p => p.id === pid);
                state.notes.push({
                    id: 'n' + Date.now(),
                    projectId: pid,
                    projectName: proj ? proj.name : '',
                    note,
                    date: todayKey(),
                    timestamp: Date.now()
                });
                await saveNotes();
                render();
            }
        };
        window.StudyTerminal = StudyTerminal;

        // live tick for running timer
        setInterval(() => {
            if (state.phase === 'ready') {
                const clockEl = document.getElementById('st-clock');
                if (!clockEl) return;
                const hasRunning = state.entries.some(e => e.timeInterval && !e.timeInterval.end);
                if (!hasRunning) return;
                const dailyMap = computeDaily();
                const total = (dailyMap[todayKey()] && dailyMap[todayKey()].total) || 0;
                clockEl.textContent = fmtHMS(total);
            }
        }, 1000);

        (async function init() {
            await waitForStorage();
            const cfg = await loadConfig();
            if (cfg && cfg.apiKey && cfg.workspaceId && cfg.userId) {
                state.config = cfg;
                await loadAll();
            } else {
                state.phase = 'setup';
                render();
            }
        })();
    })();
</script>

</html>
