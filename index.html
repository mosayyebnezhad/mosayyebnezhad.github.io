<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Loading...</title>
  <meta name="description" content="" />
  <meta name="author" content="Mohammad Hasan Mosayyebnezhad" />
  <meta name="theme-color" content="#09090b" />

  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="" />
  <meta property="og:image" content="" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />

  <style>
    :root {
      --bg:#09090b;
      --bg-soft:#0f1012;
      --surface:#121316;
      --surface-2:#17181c;
      --text:#f4f4f5;
      --text-soft:#a1a1aa;
      --text-muted:#71717a;
      --border:rgba(255,255,255,.09);
      --border-hover:rgba(255,255,255,.17);
      --success:#8ed6ae;
      --max-width:1180px;
      --nav-height:76px;
      --radius-md:16px;
      --radius-lg:24px;
      --ease:cubic-bezier(.22,1,.36,1);
    }

    *{box-sizing:border-box;margin:0;padding:0}

    html{
      scroll-behavior:smooth;
      scroll-padding-top:100px
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
      color:var(--text);
      background:
        radial-gradient(circle at 80% 0%,rgba(255,255,255,.045),transparent 28%),
        radial-gradient(circle at 10% 30%,rgba(255,255,255,.025),transparent 25%),
        var(--bg);
      font-family:Inter,sans-serif;
      line-height:1.7;
      -webkit-font-smoothing:antialiased
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:9999;
      opacity:.018;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")
    }

    ::selection{
      color:#09090b;
      background:#fff
    }

    a{color:inherit;text-decoration:none}
    button{font:inherit;cursor:pointer}
    img{max-width:100%;display:block}

    .container{
      width:min(calc(100% - 48px),var(--max-width));
      margin-inline:auto
    }

    .mono{font-family:"JetBrains Mono",monospace}

    .loader{
      position:fixed;
      inset:0;
      z-index:10000;
      display:grid;
      place-items:center;
      background:var(--bg);
      transition:opacity .7s var(--ease),visibility .7s var(--ease)
    }

    .loader.hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none
    }

    .loader-inner{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px
    }

    .loader-mark{
      width:48px;
      height:48px;
      border:1px solid var(--border-hover);
      border-radius:50%;
      display:grid;
      place-items:center;
      animation:pulse 1.5s ease-in-out infinite
    }

    .loader-mark span{
      font-size:13px;
      font-weight:700
    }

    .loader-text{
      color:var(--text-muted);
      font-size:11px;
      letter-spacing:.2em;
      text-transform:uppercase
    }

    @keyframes pulse{
      0%,100%{transform:scale(.9);opacity:.45}
      50%{transform:scale(1);opacity:1}
    }

    .scroll-progress{
      position:fixed;
      top:0;
      left:0;
      z-index:1001;
      width:0;
      height:2px;
      background:#fff
    }

    .navbar{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:1000;
      height:var(--nav-height);
      border-bottom:1px solid transparent;
      transition:all .4s var(--ease)
    }

    .navbar.scrolled{
      height:66px;
      background:rgba(9,9,11,.78);
      border-color:var(--border);
      backdrop-filter:blur(18px)
    }

    .nav-inner{
      height:100%;
      display:flex;
      align-items:center;
      justify-content:space-between
    }

    .brand{
      display:inline-flex;
      align-items:center;
      gap:11px;
      font-weight:700
    }

    .brand-mark{
      width:33px;
      height:33px;
      border:1px solid var(--border-hover);
      border-radius:9px;
      display:grid;
      place-items:center;
      font-family:"JetBrains Mono";
      font-size:12px
    }

    .brand-name{font-size:14px}

    .nav-links{
      display:flex;
      align-items:center;
      gap:4px;
      list-style:none
    }

    .nav-links a{
      position:relative;
      padding:8px 12px;
      color:var(--text-muted);
      font-size:12px;
      transition:color .3s
    }

    .nav-links a:hover,
    .nav-links a.active{
      color:var(--text)
    }

    .nav-links a::after{
      content:"";
      position:absolute;
      left:12px;
      right:12px;
      bottom:2px;
      height:1px;
      background:var(--text);
      transform:scaleX(0);
      transition:transform .3s var(--ease)
    }

    .nav-links a.active::after{
      transform:scaleX(1)
    }

    .menu-toggle{
      display:none;
      width:40px;
      height:40px;
      color:var(--text);
      background:transparent;
      border:1px solid var(--border);
      border-radius:10px
    }

    .hero{
      min-height:100svh;
      position:relative;
      display:flex;
      align-items:center;
      padding:150px 0 90px;
      overflow:hidden
    }

    .hero::before{
      content:"";
      position:absolute;
      width:650px;
      height:650px;
      right:-250px;
      top:50px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.05),transparent 65%);
      animation:ambient 10s ease-in-out infinite alternate
    }

    @keyframes ambient{
      from{transform:translate3d(0,0,0) scale(1)}
      to{transform:translate3d(-50px,35px,0) scale(1.08)}
    }

    .hero-grid{
      position:absolute;
      inset:0;
      opacity:.17;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
      background-size:70px 70px;
      mask-image:linear-gradient(to bottom,black,transparent 85%)
    }

    .hero-content{
      position:relative;
      z-index:1;
      max-width:900px
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:9px;
      margin-bottom:25px;
      color:var(--text-muted);
      font-size:11px;
      letter-spacing:.16em;
      text-transform:uppercase
    }

    .eyebrow::before{
      content:"";
      width:26px;
      height:1px;
      background:var(--text-muted)
    }

    .status{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-left:10px;
      padding:4px 9px;
      border:1px solid rgba(142,214,174,.16);
      border-radius:999px;
      color:#9adab6;
      background:rgba(142,214,174,.04);
      font-size:9px;
      letter-spacing:.08em
    }

    .status-dot{
      width:5px;
      height:5px;
      border-radius:50%;
      background:var(--success)
    }

    .hero h1{
      max-width:950px;
      font-size:clamp(3rem,7vw,6.5rem);
      line-height:.99;
      letter-spacing:-.075em
    }

    .hero h1 .muted{color:#55565b}

    .hero-description{
      max-width:670px;
      margin-top:30px;
      color:var(--text-soft);
      font-size:clamp(15px,1.5vw,18px);
      line-height:1.8
    }

    .typing{
      color:var(--text);
      border-right:1px solid var(--text-muted);
      padding-right:3px;
      animation:caret .9s step-end infinite
    }

    @keyframes caret{
      50%{border-color:transparent}
    }

    .hero-actions{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:12px;
      margin-top:38px
    }

    .btn{
      min-height:46px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:0 19px;
      border:1px solid var(--border-hover);
      border-radius:11px;
      font-size:12px;
      font-weight:600;
      transition:transform .35s var(--ease),background .35s,border-color .35s
    }

    .btn:hover{
      transform:translateY(-3px);
      border-color:rgba(255,255,255,.28)
    }

    .btn-primary{
      color:#09090b;
      background:#f5f5f5
    }

    .btn-secondary{
      color:var(--text);
      background:rgba(255,255,255,.025)
    }

    .social-links{
      display:flex;
      align-items:center;
      gap:7px;
      margin-left:5px
    }

    .social-link{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      color:var(--text-muted);
      border:1px solid var(--border);
      border-radius:10px;
      transition:all .3s var(--ease)
    }

    .social-link:hover{
      color:var(--text);
      border-color:var(--border-hover);
      transform:translateY(-3px)
    }

    .hero-meta{
      display:flex;
      align-items:center;
      gap:28px;
      margin-top:72px;
      color:var(--text-muted);
      font-family:"JetBrains Mono";
      font-size:10px;
      text-transform:uppercase
    }

    .hero-meta span{
      display:flex;
      align-items:center;
      gap:8px
    }

    section{
      position:relative;
      padding:120px 0
    }

    .section-header{
      display:grid;
      grid-template-columns:180px 1fr;
      gap:60px;
      margin-bottom:60px
    }

    .section-label{
      color:var(--text-muted);
      font-family:"JetBrains Mono";
      font-size:10px;
      letter-spacing:.14em;
      text-transform:uppercase
    }

    .section-label::before{
      content:"// ";
      color:#4f5055
    }

    .section-heading{
      max-width:800px;
      font-size:clamp(2rem,4vw,3.6rem);
      line-height:1.05;
      letter-spacing:-.055em
    }

    .section-heading span{color:#5c5d62}

    .section-intro{
      max-width:670px;
      margin-top:18px;
      color:var(--text-soft);
      font-size:15px
    }

    .about-grid{
      display:grid;
      grid-template-columns:1.25fr .75fr;
      gap:80px
    }

    .about-copy p{
      margin-bottom:20px;
      color:var(--text-soft);
      font-size:16px;
      line-height:1.95
    }

    .about-copy p:first-child{
      color:#d7d7da;
      font-size:19px
    }

    .about-facts{border-top:1px solid var(--border)}

    .fact{
      display:grid;
      grid-template-columns:105px 1fr;
      gap:20px;
      padding:18px 0;
      border-bottom:1px solid var(--border)
    }

    .fact-label{
      color:var(--text-muted);
      font-family:"JetBrains Mono";
      font-size:10px;
      text-transform:uppercase
    }

    .fact-value{
      color:var(--text-soft);
      font-size:13px
    }

    .skills-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:15px
    }

    .skill-card{
      padding:28px;
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(255,255,255,.008));
      transition:all .4s var(--ease)
    }

    .skill-card:hover{
      transform:translateY(-6px);
      border-color:var(--border-hover)
    }

    .skill-icon{
      width:40px;
      height:40px;
      display:grid;
      place-items:center;
      margin-bottom:22px;
      border:1px solid var(--border);
      border-radius:10px
    }

    .skill-card h3{
      margin-bottom:9px;
      font-size:17px
    }

    .skill-card p{
      margin-bottom:20px;
      color:var(--text-muted);
      font-size:12px
    }

    .skill-list,
    .project-tech,
    .github-points{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      list-style:none
    }

    .skill-list li,
    .project-tech span{
      padding:5px 9px;
      border:1px solid var(--border);
      border-radius:7px;
      color:#aaaab0;
      font-family:"JetBrains Mono";
      font-size:9px
    }

    .tech-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px
    }

    .tech-item{
      min-height:155px;
      padding:23px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      background:var(--surface);
      transition:all .4s var(--ease)
    }

    .tech-item:hover{
      transform:translateY(-5px);
      border-color:var(--border-hover)
    }

    .tech-top{
      display:flex;
      justify-content:space-between
    }

    .tech-icon{font-size:24px;color:#d7d7d9}

    .tech-number{
      color:#494a4e;
      font-family:"JetBrains Mono";
      font-size:9px
    }

    .tech-info h3{font-size:14px}
    .tech-info p{color:var(--text-muted);font-size:10px}

    .projects{border-top:1px solid var(--border)}

    .featured-project{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      min-height:460px;
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      background:var(--surface)
    }

    .project-visual{
      position:relative;
      min-height:430px;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 50%,rgba(255,255,255,.08),transparent 35%),
        #0c0d0f;
      border-right:1px solid var(--border)
    }

    .project-visual::before{
      content:"";
      position:absolute;
      inset:35px;
      border:1px solid rgba(255,255,255,.06);
      border-radius:20px;
      transform:rotate(-4deg)
    }

    .project-orbit{
      position:relative;
      width:190px;
      height:190px;
      border:1px solid rgba(255,255,255,.13);
      border-radius:50%;
      animation:orbit 16s linear infinite
    }

    .project-orbit::before,
    .project-orbit::after{
      content:"";
      position:absolute;
      border-radius:50%
    }

    .project-orbit::before{
      width:8px;
      height:8px;
      top:18px;
      left:40px;
      background:#fff
    }

    .project-orbit::after{
      width:5px;
      height:5px;
      right:22px;
      bottom:30px;
      background:#aaa
    }

    .project-core{
      position:absolute;
      inset:50%;
      width:78px;
      height:78px;
      transform:translate(-50%,-50%);
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.18);
      border-radius:20px;
      background:rgba(255,255,255,.06);
      backdrop-filter:blur(12px);
      font-family:"JetBrains Mono";
      font-size:12px
    }

    @keyframes orbit{
      to{transform:rotate(360deg)}
    }

    .project-content{
      padding:50px;
      display:flex;
      flex-direction:column;
      justify-content:center
    }

    .project-tag{
      width:max-content;
      margin-bottom:20px;
      padding:5px 9px;
      border:1px solid var(--border);
      border-radius:6px;
      color:#aaa;
      font-family:"JetBrains Mono";
      font-size:9px
    }

    .project-content h3{
      margin-bottom:16px;
      font-size:clamp(2rem,4vw,3rem);
      letter-spacing:-.055em
    }

    .project-content>p{
      color:var(--text-soft);
      font-size:14px;
      line-height:1.9
    }

    .project-tech{margin-top:25px}

    .project-actions{
      display:flex;
      gap:9px;
      margin-top:30px
    }

    .project-actions .btn{
      min-height:40px;
      padding-inline:14px;
      font-size:10px
    }

    .secondary-projects{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:15px;
      margin-top:15px
    }

    .project-card{
      min-height:300px;
      padding:32px;
      display:flex;
      flex-direction:column;
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      background:var(--surface);
      transition:all .4s var(--ease)
    }

    .project-card:hover{
      transform:translateY(-5px);
      border-color:var(--border-hover)
    }

    .project-card-number{
      color:#45464a;
      font-family:"JetBrains Mono";
      font-size:10px
    }

    .project-card h3{
      margin-top:45px;
      font-size:25px
    }

    .project-card p{
      margin-top:10px;
      color:var(--text-muted);
      font-size:12px;
      line-height:1.8
    }

    .project-card .project-tech{
      margin-top:auto;
      padding-top:25px
    }

    .timeline{
      position:relative
    }

    .timeline::before{
      content:"";
      position:absolute;
      left:7px;
      top:5px;
      bottom:5px;
      width:1px;
      background:var(--border)
    }

    .timeline-item{
      position:relative;
      padding-left:48px;
      padding-bottom:55px
    }

    .timeline-item:last-child{padding-bottom:0}

    .timeline-dot{
      position:absolute;
      left:0;
      top:5px;
      width:15px;
      height:15px;
      border:1px solid #555;
      border-radius:50%;
      background:var(--bg)
    }

    .timeline-item.active .timeline-dot{
      background:#fff;
      border-color:#fff
    }

    .timeline-date{
      margin-bottom:8px;
      color:var(--text-muted);
      font-family:"JetBrains Mono";
      font-size:10px;
      text-transform:uppercase
    }

    .timeline-item h3{
      margin-bottom:6px;
      font-size:21px
    }

    .timeline-item p{
      max-width:700px;
      color:var(--text-soft);
      font-size:13px
    }

    .learning-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px
    }

    .learning-card{
      padding:27px;
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      background:linear-gradient(135deg,rgba(255,255,255,.025),transparent)
    }

    .learning-card h3{
      margin-bottom:22px;
      font-size:14px
    }

    .learning-list{
      list-style:none;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px
    }

    .learning-list li{
      padding:9px 11px;
      border:1px solid var(--border);
      border-radius:8px;
      color:#a9a9ae;
      font-size:11px;
      transition:.3s
    }

    .learning-list li:hover{
      color:var(--text);
      border-color:var(--border-hover)
    }

    .learning-card.feature{
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      background:radial-gradient(circle at 100% 0%,rgba(255,255,255,.07),transparent 50%),var(--surface)
    }

    .learning-card.feature p{
      color:var(--text-soft);
      font-size:14px;
      line-height:1.9
    }

    .learning-quote{
      margin-top:35px;
      color:#77787d;
      font-family:"JetBrains Mono";
      font-size:10px
    }

    .roadmap{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:1px;
      border:1px solid var(--border);
      background:var(--border);
      overflow:hidden;
      border-radius:var(--radius-md)
    }

    .roadmap-item{
      min-height:280px;
      padding:27px;
      background:var(--surface);
      transition:.35s
    }

    .roadmap-item:hover{background:var(--surface-2)}

    .roadmap-number{
      color:#55565a;
      font-family:"JetBrains Mono";
      font-size:10px
    }

    .roadmap-icon{
      margin-top:55px;
      margin-bottom:20px;
      color:#c8c8ca;
      font-size:20px
    }

    .roadmap-item h3{
      margin-bottom:9px;
      font-size:15px
    }

    .roadmap-item p{
      color:var(--text-muted);
      font-size:11px;
      line-height:1.8
    }

    .github-card{
      position:relative;
      padding:70px;
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      background:
        radial-gradient(circle at 80% 20%,rgba(255,255,255,.07),transparent 32%),
        linear-gradient(135deg,#101113,#0c0d0f)
    }

    .github-content{
      position:relative;
      z-index:1;
      max-width:720px
    }

    .github-icon{
      margin-bottom:25px;
      font-size:34px
    }

    .github-card h2{
      font-size:clamp(2.3rem,5vw,4.5rem);
      line-height:1;
      letter-spacing:-.06em
    }

    .github-card p{
      margin-top:22px;
      color:var(--text-soft);
      font-size:14px;
      line-height:1.9
    }

    .github-points{margin-top:25px}

    .github-points span{
      padding:6px 10px;
      border:1px solid var(--border);
      border-radius:7px;
      color:#9d9da2;
      font-size:10px
    }

    .github-card .btn{margin-top:32px}

    .contact-grid{
      display:grid;
      grid-template-columns:1fr .8fr;
      gap:100px
    }

    .contact-title{
      font-size:clamp(2.5rem,5vw,5rem);
      line-height:.98;
      letter-spacing:-.065em
    }

    .contact-title span{color:#55565b}

    .contact-copy{
      margin-top:24px;
      max-width:550px;
      color:var(--text-soft);
      font-size:14px
    }

    .contact-links{border-top:1px solid var(--border)}

    .contact-link{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px 0;
      border-bottom:1px solid var(--border);
      color:var(--text-soft);
      transition:.3s
    }

    .contact-link:hover{color:var(--text)}

    .contact-link-left{
      display:flex;
      align-items:center;
      gap:13px
    }

    .contact-link i:first-child{
      width:22px;
      color:#777
    }

    .contact-link span{font-size:12px}

    .contact-arrow{
      color:#555;
      transition:.3s var(--ease)
    }

    .contact-link:hover .contact-arrow{
      transform:translate(4px,-4px);
      color:#aaa
    }

    footer{
      padding:35px 0;
      border-top:1px solid var(--border)
    }

    .footer-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px
    }

    .footer-copy{
      color:var(--text-muted);
      font-size:10px
    }

    .footer-copy strong{
      color:#999;
      font-weight:500
    }

    .footer-status{
      display:flex;
      align-items:center;
      gap:8px;
      color:#777;
      font-family:"JetBrains Mono";
      font-size:9px
    }

    .footer-status::before{
      content:"";
      width:5px;
      height:5px;
      border-radius:50%;
      background:var(--success)
    }

    .back-top{
      position:fixed;
      right:25px;
      bottom:25px;
      z-index:500;
      width:43px;
      height:43px;
      display:grid;
      place-items:center;
      color:var(--text);
      background:rgba(15,16,18,.8);
      border:1px solid var(--border-hover);
      border-radius:11px;
      backdrop-filter:blur(12px);
      opacity:0;
      visibility:hidden;
      transform:translateY(15px);
      transition:.35s var(--ease)
    }

    .back-top.visible{
      opacity:1;
      visibility:visible;
      transform:translateY(0)
    }

    .reveal{
      opacity:0;
      transform:translateY(28px);
      transition:opacity .8s var(--ease),transform .8s var(--ease)
    }

    .reveal.visible{
      opacity:1;
      transform:translateY(0)
    }

    .delay-1{transition-delay:.08s}
    .delay-2{transition-delay:.16s}
    .delay-3{transition-delay:.24s}

    .error-screen{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:30px
    }

    .error-box{
      max-width:600px;
      padding:40px;
      border:1px solid var(--border);
      border-radius:20px;
      background:var(--surface)
    }

    .error-box h1{
      margin-bottom:15px;
      font-size:28px
    }

    .error-box p{
      color:var(--text-soft)
    }

    @media(max-width:1000px){
      .section-header{
        grid-template-columns:130px 1fr;
        gap:35px
      }

      .skills-grid{grid-template-columns:1fr 1fr}
      .tech-grid{grid-template-columns:repeat(3,1fr)}

      .featured-project{
        grid-template-columns:1fr
      }

      .project-visual{
        min-height:350px;
        border-right:0;
        border-bottom:1px solid var(--border)
      }

      .roadmap{grid-template-columns:1fr 1fr}
    }

    @media(max-width:760px){
      .container{
        width:min(calc(100% - 32px),var(--max-width))
      }

      section{padding:85px 0}

      .navbar{height:68px}
      .navbar.scrolled{height:62px}

      .menu-toggle{
        display:grid;
        place-items:center
      }

      .nav-links{
        position:fixed;
        top:68px;
        left:16px;
        right:16px;
        display:flex;
        flex-direction:column;
        align-items:stretch;
        padding:9px;
        border:1px solid var(--border);
        border-radius:14px;
        background:rgba(15,16,18,.96);
        backdrop-filter:blur(20px);
        opacity:0;
        visibility:hidden;
        transform:translateY(-10px);
        transition:.3s var(--ease)
      }

      .nav-links.open{
        opacity:1;
        visibility:visible;
        transform:translateY(0)
      }

      .nav-links a{
        padding:13px
      }

      .nav-links a::after{display:none}

      .hero{
        padding-top:125px;
        min-height:auto
      }

      .hero h1{
        font-size:clamp(2.8rem,13vw,4.5rem)
      }

      .hero-description{font-size:14px}

      .hero-actions{align-items:stretch}

      .social-links{margin-left:0}

      .hero-meta{
        flex-wrap:wrap;
        gap:12px 20px;
        margin-top:48px
      }

      .section-header{
        display:block;
        margin-bottom:42px
      }

      .section-label{margin-bottom:18px}

      .section-heading{
        font-size:clamp(2rem,10vw,3rem)
      }

      .about-grid{
        grid-template-columns:1fr;
        gap:45px
      }

      .skills-grid{grid-template-columns:1fr}
      .tech-grid{grid-template-columns:1fr 1fr}

      .project-content{padding:32px 24px}
      .project-visual{min-height:300px}

      .secondary-projects{
        grid-template-columns:1fr
      }

      .learning-grid{
        grid-template-columns:1fr
      }

      .learning-list{
        grid-template-columns:1fr
      }

      .roadmap{
        grid-template-columns:1fr
      }

      .roadmap-item{min-height:220px}

      .github-card{padding:40px 25px}

      .contact-grid{
        grid-template-columns:1fr;
        gap:50px
      }

      .footer-inner{
        align-items:flex-start;
        flex-direction:column
      }
    }

    @media(max-width:430px){
      .brand-name{display:none}

      .hero-actions{
        display:grid;
        grid-template-columns:1fr 1fr
      }

      .hero-actions .social-links{
        grid-column:1/-1
      }

      .btn{
        width:100%;
        padding-inline:12px
      }

      .tech-item{
        min-height:125px;
        padding:17px
      }

      .project-actions{
        flex-direction:column
      }

      .project-actions .btn{width:100%}
    }

    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}

      *,
      *::before,
      *::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }

      .reveal{
        opacity:1;
        transform:none
      }
    }
  </style>

</head>

<body>

  <div class="loader" id="loader">
    <div class="loader-inner">
      <div class="loader-mark">
        <span id="loaderInitials">MH</span>
      </div>
      <div class="loader-text">Loading portfolio</div>
    </div>
  </div>

  <div class="scroll-progress" id="scrollProgress"></div>

  <header class="navbar" id="navbar">
    <div class="container nav-inner">


  <a href="#home" class="brand">
    <span class="brand-mark" id="brandInitials">MH</span>
    <span class="brand-name" id="brandName"></span>
  </a>

  <nav aria-label="Main navigation">
    <ul class="nav-links" id="navLinks">
      <li><a href="#home" class="active">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#education">Education</a></li>
      <li><a href="#goals">Goals</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <button
    class="menu-toggle"
    id="menuToggle"
    aria-label="Open navigation menu"
    aria-expanded="false"
  >
    <i class="fa-solid fa-bars"></i>
  </button>

</div>


  </header>

  <main id="app"></main>

  <footer>
    <div class="container footer-inner">
      <p class="footer-copy">
        © <span id="year"></span>
        <strong id="footerName"></strong>.
        Built with curiosity & code.
      </p>


  <div class="footer-status">
    Always learning · Always building
  </div>
</div>


  </footer>

  <button class="back-top" id="backTop" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script>
    (() => {
      "use strict";

      const $ = (selector, parent = document) =>
        parent.querySelector(selector);

      const $$ = (selector, parent = document) =>
        [...parent.querySelectorAll(selector)];

      const prefersReducedMotion =
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      async function loadPortfolio() {
        try {
          const response = await fetch("./cv/data.json", {
            cache: "no-cache"
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          renderHead(data);
          renderNavigation(data);
          renderHero(data);
          renderAbout(data);
          renderSkills(data);
          renderTechStack(data);
          renderProjects(data);
          renderEducation(data);
          renderLearning(data);
          renderGoals(data);
          renderExperience(data);
          renderGithub(data);
          renderContact(data);
          renderFooter(data);

          initializeInteractions(data);

          setTimeout(() => {
            $("#loader").classList.add("hidden");
          }, prefersReducedMotion ? 0 : 450);

        } catch (error) {
          console.error(error);

          document.body.innerHTML = `
            <div class="error-screen">
              <div class="error-box">
                <h1>Unable to load portfolio</h1>
                <p>
                  Make sure <strong>index.html</strong> and
                  <strong>data.json</strong> are in the same directory
                  and that the site is being served through a web server.
                </p>
              </div>
            </div>
          `;
        }
      }

      function renderHead(data) {
        document.title = data.site.title;

        $("meta[name='description']").content =
          data.site.description;

        $("meta[property='og:title']").content =
          data.site.title;

        $("meta[property='og:description']").content =
          data.site.description;

        $("meta[property='og:url']").content =
          data.site.url;

        $("meta[property='og:image']").content =
          data.site.ogImage;
      }

      function renderNavigation(data) {
        $("#brandInitials").textContent =
          data.personal.initials;

        $("#loaderInitials").textContent =
          data.personal.initials;

        $("#brandName").textContent =
          data.personal.shortName;
      }

      function renderHero(data) {
        const p = data.personal;
        const social = data.social;

        $("#app").insertAdjacentHTML("beforeend", `
          <section class="hero" id="home">
            <div class="hero-grid"></div>

            <div class="container">
              <div class="hero-content">

                <div class="eyebrow reveal">
                  ${escapeHTML(p.field)}

                  <span class="status">
                    <span class="status-dot"></span>
                    Building & Learning
                  </span>
                </div>

                <h1 class="reveal delay-1">
                  ${escapeHTML(p.shortName)}
                  <span class="muted">
                    ${escapeHTML(
                      p.name.replace(p.shortName, "").trim()
                    )}
                  </span>
                </h1>

                <p class="hero-description reveal delay-2">
                  <span class="typing" id="typingText"></span>
                  <br />
                  ${escapeHTML(p.heroDescription)}
                </p>

                <div class="hero-actions reveal delay-3">

                  <a href="#projects" class="btn btn-primary magnetic">
                    View Projects
                    <i class="fa-solid fa-arrow-down"></i>
                  </a>

                  <a href="#contact" class="btn btn-secondary magnetic">
                    Contact Me
                    <i class="fa-regular fa-paper-plane"></i>
                  </a>

                  <div class="social-links">

                    <a
                      href="${safeUrl(social.github)}"
                      class="social-link"
                      target="_blank"
                      rel="noopener noreferrer"
                      aria-label="GitHub"
                    >
                      <i class="fa-brands fa-github"></i>
                    </a>

                    <a
                      href="${safeUrl(social.linkedin)}"
                      class="social-link"
                      target="_blank"
                      rel="noopener noreferrer"
                      aria-label="LinkedIn"
                    >
                      <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                    <a
                      href="${safeUrl(social.telegram)}"
                      class="social-link"
                      target="_blank"
                      rel="noopener noreferrer"
                      aria-label="Telegram"
                    >
                      <i class="fa-brands fa-telegram"></i>
                    </a>

                  </div>
                </div>

                <div class="hero-meta reveal">
                  <span>
                    <i class="fa-solid fa-location-dot"></i>
                    ${escapeHTML(p.field)}
                  </span>

                  <span>
                    <i class="fa-solid fa-code"></i>
                    ${escapeHTML(p.focus)}
                  </span>

                  <span>
                    <i class="fa-solid fa-layer-group"></i>
                    Open Source
                  </span>
                </div>

              </div>
            </div>
          </section>
        `);
      }

      function renderAbout(data) {
        const p = data.personal;

        $("#app").insertAdjacentHTML("beforeend", `
          <section id="about">
            <div class="container">

              <div class="section-header reveal">
                <div class="section-label">About me</div>

                <div>
                  <h2 class="section-heading">
                    Building software while
                    <span>understanding how it works.</span>
                  </h2>

                  <p class="section-intro">
                    I am interested in software development from both practical
                    and fundamental perspectives — from creating web applications
                    to understanding the computer science concepts behind them.
                  </p>
                </div>
              </div>

              <div class="about-grid">

                <div class="about-copy reveal">
                  ${p.about.map(text => `
                    <p>${escapeHTML(text)}</p>
                  `).join("")}
                </div>

                <div class="about-facts reveal delay-1">

                  ${fact("Name", p.name)}
                  ${fact("Field", p.field)}
                  ${fact("University", p.university)}
                  ${fact("Focus", p.focus)}
                  ${fact("Interests", p.interests.join(" · "))}
                  ${fact("Languages", p.languages.join(" · "))}

                </div>

              </div>
            </div>
          </section>
        `);
      }

      function fact(label, value) {
        return `
          <div class="fact">
            <span class="fact-label">${escapeHTML(label)}</span>
            <span class="fact-value">${escapeHTML(value)}</span>
          </div>
        `;
      }

      function renderSkills(data) {
        $("#app").insertAdjacentHTML("beforeend", `
          <section id="skills">
            <div class="container">

              <div class="section-header reveal">
                <div class="section-label">Capabilities</div>

                <div>
                  <h2 class="section-heading">
                    Tools I use to
                    <span>build software.</span>
                  </h2>

                  <p class="section-intro">
                    A practical stack that continues to evolve as I learn,
                    experiment, and build more complex projects.
                  </p>
                </div>
              </div>

              <div class="skills-grid">

                ${Object.values(data.skills).map((skill, index) => `
                  <article class="skill-card reveal ${delay(index)}">

                    <div class="skill-icon">
                      <i class="${escapeHTML(skill.icon)}"></i>
                    </div>

                    <h3>${escapeHTML(skill.title)}</h3>

                    <p>${escapeHTML(skill.description)}</p>

                    <ul class="skill-list">
                      ${skill.items.map(item => `
                        <li>${escapeHTML(item)}</li>
                      `).join("")}
                    </ul>

                  </article>
                `).join("")}

              </div>
            </div>
          </section>
        `);
      }

      function renderTechStack(data) {
        $("#app").insertAdjacentHTML("beforeend", `
          <section id="tech-stack">

            <div class="container">

              <div class="section-header reveal">
                <div class="section-label">Tech stack</div>

                <div>
                  <h2 class="section-heading">
                    Technologies I
                    <span>work with.</span>
                  </h2>
                </div>
              </div>

              <div class="tech-grid">

                ${data.techStack.map((tech, index) => `
                  <article class="tech-item reveal ${delay(index)}">

                    <div class="tech-top">
                      <i class="${escapeHTML(tech.icon)} tech-icon"></i>
                      <span class="tech-number">
                        ${String(index + 1).padStart(2, "0")}
                      </span>
                    </div>

                    <div class="tech-info">
                      <h3>${escapeHTML(tech.name)}</h3>
                      <p>${escapeHTML(tech.category)}</p>
                    </div>

                  </article>
                `).join("")}

              </div>

            </div>
          </section>
        `);
      }

      function renderProjects(data) {
        const featured = data.projects.find(p => p.featured);
        const secondary = data.projects.filter(p => !p.featured);

        $("#app").insertAdjacentHTML("beforeend", `
          <section id="projects" class="projects">

            <div class="container">

              <div class="section-header reveal">
                <div class="section-label">Selected work</div>

                <div>
                  <h2 class="section-heading">
                    Things I've
                    <span>built.</span>
                  </h2>

                  <p class="section-intro">
                    Projects are where I turn concepts into working software
                    and learn by solving real engineering problems.
                  </p>
                </div>
              </div>

              ${featured ? `
                <article class="featured-project reveal">

                  <div class="project-visual">
                    <div class="project-orbit">
                      <div class="project-core">
                        ${escapeHTML(featured.name)}
                      </div>
                    </div>
                  </div>

                  <div class="project-content">

                    <span class="project-tag">
                      ${escapeHTML(featured.type)}
                    </span>

                    <h3>${escapeHTML(featured.name)}</h3>

                    <p>${escapeHTML(featured.description)}</p>

                    <div class="project-tech">
                      ${featured.technologies.map(t => `
                        <span>${escapeHTML(t)}</span>
                      `).join("")}
                    </div>

                    ${featured.github ? `
                      <div class="project-actions">
                        <a
                          href="${safeUrl(featured.github)}"
                          target="_blank"
                          rel="noopener noreferrer"
                          class="btn btn-secondary"
                        >
                          View Project
                          <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                      </div>
                    ` : ""}

                  </div>

                </article>
              ` : ""}

              <div class="secondary-projects">

                ${secondary.map((project, index) => `
                  <article class="project-card reveal ${delay(index)}">

                    <span class="project-card-number">
                      PROJECT / ${String(index + 2).padStart(2, "0")}
                    </span>

                    <h3>${escapeHTML(project.name)}</h3>

                    <p>${escapeHTML(project.description)}</p>

                    <div class="project-tech">
                      ${project.technologies.map(t => `
                        <span>${escapeHTML(t)}</span>
                      `).join("")}
                    </div>

                  </article>
                `).join("")}

              </div>

            </div>
          </section>
        `);
      }

      function renderEducation(data) {
        $("#app").insertAdjacentHTML("beforeend", `
          <section id="education">

            <div class="container">

              <div class="section-header reveal">
                <div class="section-label">Education</div>

                <div>
                  <h2 class="section-heading">
                    Learning beyond
                    <span>the classroom.</span>
                  </h2>

                  <p class="section-intro">
                    Formal education provides the foundation. Projects and
                    focused self-learning help me turn that foundation into
                    practical skill.
                  </p>
                </div>
              </div>

              <div class="timeline">

                ${data.education.map((item, index) => `
                  <article class="timeline-item ${item.active ? "active" : ""} reveal ${delay(index)}">

                    <div class="timeline-dot"></div>

                    <div class="timeline-date">
                      ${escapeHTML(item.date)}
                    </div>

                    <h3>${escapeHTML(item.title)}</h3>

                    <p>${escapeHTML(item.description)}</p>

                  </article>
                `).join("")}

              </div>

            </div>
          </section>
        `);
      }

      function renderLearning(data) {
        $("#app").insertAdjacentHTML("beforeend", `
          <section id="learning">

            <div class="container">

              <div class="section-header reveal">
                <div class="section-label">Computer science</div>

                <div>
                  <h2 class="section-heading">
                    Going deeper than
                    <span>frameworks.</span>
                  </h2>

                  <p class="section-intro">
                    Frameworks change. Strong fundamentals remain useful.
                    My learning path therefore includes both practical
                    engineering and core CS.
                  </p>
                </div>
              </div>

              <div class="learning-grid">

                <article class="learning-card feature reveal">

                  <div>
                    <h3>My learning philosophy</h3>

                    <p>
                      ${escapeHTML(data.learning.philosophy)}
                    </p>
                  </div>

                  <div class="learning-quote">
                    ${escapeHTML(data.learning.quote)}
                  </div>

                </article>

                <article class="learning-card reveal delay-1">

                  <h3>Core subjects</h3>

                  <ul class="learning-list">
                    ${data.learning.subjects.map(subject => `
                      <li>${escapeHTML(subject)}</li>
                    `).join("")}
                  </ul>

                </article>

              </div>

            </div>
          </section>
        `);
      }

      function renderGoals(data) {
        $("#app").insertAdjacentHTML("beforeend", `
          <section id="goals">

            <div class="container">

              <div class="section-header reveal">
                <div class="section-label">Direction</div>

                <div>
                  <h2 class="section-heading">
                    Where I'm
                    <span>heading.</span>
                  </h2>

                  <p class="section-intro">
                    A long-term direction built around stronger engineering
                    skills, deeper computer science knowledge and meaningful
                    software.
                  </p>
                </div>
              </div>

              <div class="roadmap">

                ${data.goals.map((goal, index) => `
                  <article class="roadmap-item reveal ${delay(index)}">

                    <span class="roadmap-number">
                      ${escapeHTML(goal.number)}
                    </span>

                    <div class="roadmap-icon">
                      <i class="${escapeHTML(goal.icon)}"></i>
                    </div>

                    <h3>${escapeHTML(goal.title)}</h3>

                    <p>${escapeHTML(goal.description)}</p>

                  </article>
                `).join("")}

              </div>

            </div>
          </section>
        `);
      }

      function renderExperience(data) {
        $("#app").insertAdjacentHTML("beforeend", `
          <section id="experience">

            <div class="container">

              <div class="section-header reveal">
                <div class="section-label">Experience</div>

                <div>
                  <h2 class="section-heading">
                    Practical experience
                    <span>through building.</span>
                  </h2>

                  <p class="section-intro">
                    My practical experience currently comes primarily from
                    personal projects, open-source development, experimentation
                    and continuous learning.
                  </p>
                </div>
              </div>

              <div class="timeline">

                ${data.experience.map((item, index) => `
                  <article class="timeline-item ${item.active ? "active" : ""} reveal ${delay(index)}">

                    <div class="timeline-dot"></div>

                    <div class="timeline-date">
                      ${escapeHTML(item.date)}
                    </div>

                    <h3>${escapeHTML(item.title)}</h3>

                    <p>${escapeHTML(item.description)}</p>

                  </article>
                `).join("")}

              </div>

            </div>
          </section>
        `);
      }

      function renderGithub(data) {
        $("#app").insertAdjacentHTML("beforeend", `
          <section id="github">

            <div class="container">

              <div class="github-card reveal">

                <div class="github-content">

                  <div class="github-icon">
                    <i class="fa-brands fa-github"></i>
                  </div>

                  <h2>${data.github.title}</h2>

                  <p>
                    ${escapeHTML(data.github.description)}
                  </p>

                  <div class="github-points">
                    ${data.github.points.map(point => `
                      <span>${escapeHTML(point)}</span>
                    `).join("")}
                  </div>

                  <a
                    href="${safeUrl(data.social.github)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn btn-primary magnetic"
                  >
                    View my GitHub
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                  </a>

                </div>

              </div>

            </div>
          </section>
        `);
      }

      function renderContact(data) {
        const s = data.social;

        $("#app").insertAdjacentHTML("beforeend", `
          <section id="contact">

            <div class="container">

              <div class="contact-grid">

                <div class="reveal">

                  <div class="section-label">Contact</div>

                  <h2 class="contact-title">
                    ${data.contact.title}
                  </h2>

                  <p class="contact-copy">
                    ${escapeHTML(data.contact.description)}
                  </p>

                </div>

                <div class="contact-links reveal delay-1">

                  ${contactLink(
                    "fa-regular fa-envelope",
                    s.email,
                    `mailto:${s.email}`
                  )}

                  ${contactLink(
                    "fa-brands fa-github",
                    "GitHub",
                    s.github
                  )}

                  ${contactLink(
                    "fa-brands fa-linkedin-in",
                    "LinkedIn",
                    s.linkedin
                  )}


                </div>

              </div>

            </div>
          </section>
        `);
      }

      function contactLink(icon, label, url) {
        const external = !url.startsWith("mailto:");

        return `
          <a
            class="contact-link"
            href="${external ? safeUrl(url) : escapeAttribute(url)}"
            ${external ? 'target="_blank" rel="noopener noreferrer"' : ""}
          >
            <span class="contact-link-left">
              <i class="${icon}"></i>
              <span>${escapeHTML(label)}</span>
            </span>

            <i class="fa-solid fa-arrow-up-right-from-square contact-arrow"></i>
          </a>
        `;
      }

      function renderFooter(data) {
        $("#footerName").textContent =
          data.personal.name;

        $("#year").textContent =
          new Date().getFullYear();
      }

      function initializeInteractions(data) {

        const navbar = $("#navbar");
        const backTop = $("#backTop");
        const progress = $("#scrollProgress");
        const menuToggle = $("#menuToggle");
        const navLinks = $("#navLinks");
        const typing = $("#typingText");

        /* Typing */
        const phrases = data.personal.heroTyping;

        let phraseIndex = 0;
        let charIndex = 0;
        let deleting = false;

        function typeWriter() {
          if (prefersReducedMotion) {
            typing.textContent = phrases[0];
            return;
          }

          const phrase = phrases[phraseIndex];

          if (!deleting) {
            charIndex++;
            typing.textContent = phrase.slice(0, charIndex);

            if (charIndex === phrase.length) {
              deleting = true;
              setTimeout(typeWriter, 1800);
              return;
            }
          } else {
            charIndex--;
            typing.textContent = phrase.slice(0, charIndex);

            if (charIndex === 0) {
              deleting = false;
              phraseIndex =
                (phraseIndex + 1) % phrases.length;
            }
          }

          setTimeout(
            typeWriter,
            deleting ? 28 : 55
          );
        }

        typeWriter();

        /* Scroll */
        function updateScroll() {
          const scrollTop = window.scrollY;

          const height =
            document.documentElement.scrollHeight -
            window.innerHeight;

          const percentage =
            height > 0
              ? (scrollTop / height) * 100
              : 0;

          progress.style.width =
            `${percentage}%`;

          navbar.classList.toggle(
            "scrolled",
            scrollTop > 35
          );

          backTop.classList.toggle(
            "visible",
            scrollTop > 600
          );
        }

        window.addEventListener(
          "scroll",
          updateScroll,
          { passive:true }
        );

        updateScroll();

        /* Mobile menu */
        function closeMenu() {
          navLinks.classList.remove("open");

          menuToggle.setAttribute(
            "aria-expanded",
            "false"
          );

          menuToggle.innerHTML =
            '<i class="fa-solid fa-bars"></i>';
        }

        menuToggle.addEventListener(
          "click",
          () => {
            const open =
              navLinks.classList.toggle("open");

            menuToggle.setAttribute(
              "aria-expanded",
              String(open)
            );

            menuToggle.innerHTML = open
              ? '<i class="fa-solid fa-xmark"></i>'
              : '<i class="fa-solid fa-bars"></i>';
          }
        );

        $$(".nav-links a").forEach(link => {
          link.addEventListener(
            "click",
            closeMenu
          );
        });

        /* Reveal */
        const revealElements =
          $$(".reveal");

        if (prefersReducedMotion) {
          revealElements.forEach(el =>
            el.classList.add("visible")
          );
        } else {
          const observer =
            new IntersectionObserver(
              (entries, observer) => {
                entries.forEach(entry => {
                  if (!entry.isIntersecting)
                    return;

                  entry.target.classList.add(
                    "visible"
                  );

                  observer.unobserve(
                    entry.target
                  );
                });
              },
              {
                threshold:.1,
                rootMargin:"0px 0px -50px 0px"
              }
            );

          revealElements.forEach(el =>
            observer.observe(el)
          );
        }

        /* Active nav */
        const sections =
          $$("main section[id]");

        const links =
          $$(".nav-links a");

        const activeObserver =
          new IntersectionObserver(
            entries => {
              entries.forEach(entry => {
                if (!entry.isIntersecting)
                  return;

                const id =
                  entry.target.id;

                links.forEach(link => {
                  link.classList.toggle(
                    "active",
                    link.getAttribute("href") ===
                      `#${id}`
                  );
                });
              });
            },
            {
              rootMargin:"-35% 0px -55% 0px"
            }
          );

        sections.forEach(section =>
          activeObserver.observe(section)
        );

        /* Back top */
        backTop.addEventListener(
          "click",
          () => {
            window.scrollTo({
              top:0,
              behavior:
                prefersReducedMotion
                  ? "auto"
                  : "smooth"
            });
          }
        );

        /* Magnetic */
        if (
          !prefersReducedMotion &&
          window.matchMedia("(pointer:fine)").matches
        ) {
          $$(".magnetic").forEach(element => {

            element.addEventListener(
              "mousemove",
              event => {
                const rect =
                  element.getBoundingClientRect();

                const x =
                  (event.clientX -
                    rect.left -
                    rect.width / 2) * .12;

                const y =
                  (event.clientY -
                    rect.top -
                    rect.height / 2) * .12;

                element.style.transform =
                  `translate(${x}px,${y}px)`;
              }
            );

            element.addEventListener(
              "mouseleave",
              () => {
                element.style.transform = "";
              }
            );

          });

          const grid =
            $(".hero-grid");

          window.addEventListener(
            "mousemove",
            event => {

              const x =
                (event.clientX /
                  window.innerWidth -
                  .5) * 8;

              const y =
                (event.clientY /
                  window.innerHeight -
                  .5) * 8;

              grid.style.transform =
                `translate3d(${x}px,${y}px,0)`;
            },
            { passive:true }
          );
        }

        document.addEventListener(
          "keydown",
          event => {
            if (event.key === "Escape")
              closeMenu();
          }
        );

        window.addEventListener(
          "resize",
          () => {
            if (window.innerWidth > 760)
              closeMenu();
          }
        );
      }

      function delay(index) {
        return index % 4 === 1
          ? "delay-1"
          : index % 4 === 2
          ? "delay-2"
          : index % 4 === 3
          ? "delay-3"
          : "";
      }

      function escapeHTML(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeAttribute(value) {
        return escapeHTML(value);
      }

      function safeUrl(value) {
        const url = String(value || "").trim();

        if (
          url.startsWith("https://") ||
          url.startsWith("http://") ||
          url.startsWith("mailto:")
        ) {
          return escapeAttribute(url);
        }

        return "#";
      }

      loadPortfolio();
    })();
  </script>

</body>
